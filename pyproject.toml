[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "1.0.0"
description = "Turn long anime videos into vertical 9:16 clips that follow the main face"
requires-python = ">=3.9"

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools]
packages = ["clipper"]
